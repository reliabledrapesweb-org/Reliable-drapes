name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # NEXT_PUBLIC_* vars must be present at `next build` time to be inlined
      # into the client bundle - Cloudflare's [vars] in wrangler.toml only
      # apply at Worker runtime, not during this build step. wrangler.toml
      # already carries these as plaintext (non-secret) values, so load them
      # from there instead of duplicating them in workflow config.
      - name: Load public env vars from wrangler.toml
        run: |
          grep -E '^NEXT_PUBLIC_[A-Z_]+ = ' wrangler.toml \
            | sed -E 's/^([A-Z_]+) = "(.*)"$/\1=\2/' >> "$GITHUB_ENV"

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run cf:deploy
